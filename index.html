<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CodeChave</title>
<!-- PWA: instalar na tela de inicio do iPhone/Android e abrir em tela cheia, sem
     a barra do navegador - "Adicionar a Tela de Inicio" no Safari, ou "Instalar app" no menu do Chrome -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#303e47">
<script>
// Diagnostico de tela: abra o app com ?diag=1, ou toque 5 vezes seguidas no canto superior esquerdo (funciona no app instalado). Linha vermelha = topo e verde = fim da area do app.
(function(){
  var ligado = false;
  function iniciar(){
    if(ligado) return; ligado = true;
    var sonda = document.createElement('div');
    sonda.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);visibility:hidden';
    document.body.appendChild(sonda);
    var topo = document.createElement('div'), fim = document.createElement('div'), painel = document.createElement('pre');
    topo.style.cssText = 'position:fixed;left:0;right:0;top:0;height:6px;background:#e53935;z-index:2147483647;pointer-events:none';
    fim.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:6px;background:#43a047;z-index:2147483647;pointer-events:none';
    painel.style.cssText = 'position:fixed;left:8px;right:8px;top:50%;transform:translateY(-50%);margin:0;padding:10px;background:rgba(0,0,0,.82);color:#fff;font:11px/1.4 monospace;border-radius:8px;z-index:2147483647;white-space:pre-wrap;pointer-events:none';
    document.body.appendChild(topo); document.body.appendChild(fim); document.body.appendChild(painel);
    function medir(){
      var cs = getComputedStyle(sonda), vv = window.visualViewport;
      var m = function(q){ return window.matchMedia && window.matchMedia(q).matches; };
      painel.textContent = [
        'instalado (navigator.standalone): ' + navigator.standalone,
        'display-mode standalone/fullscreen/browser: ' + m('(display-mode:standalone)') + ' / ' + m('(display-mode:fullscreen)') + ' / ' + m('(display-mode:browser)'),
        'innerWidth x innerHeight: ' + innerWidth + ' x ' + innerHeight,
        'outerWidth x outerHeight: ' + outerWidth + ' x ' + outerHeight,
        'screen: ' + screen.width + ' x ' + screen.height + ' (avail ' + screen.availWidth + ' x ' + screen.availHeight + ')',
        'visualViewport: ' + (vv ? Math.round(vv.width) + ' x ' + Math.round(vv.height) + ' topo ' + Math.round(vv.offsetTop) : 'n/d'),
        'clientHeight html: ' + document.documentElement.clientHeight,
        'safe-area topo/base/esq/dir: ' + cs.paddingTop + ' / ' + cs.paddingBottom + ' / ' + cs.paddingLeft + ' / ' + cs.paddingRight,
        'fim da linha verde (bottom): ' + Math.round(fim.getBoundingClientRect().bottom),
        'devicePixelRatio: ' + devicePixelRatio,
        'classes html: ' + document.documentElement.className,
        'UA: ' + navigator.userAgent
      ].join('\n');
    }
    medir(); setInterval(medir, 700);
  }
  if(/[?&]diag=1/.test(location.search)){ window.addEventListener('load', iniciar); return; }
  var toques = [];
  document.addEventListener('touchstart', function(e){
    var t = e.touches && e.touches[0]; if(!t || t.clientX > 90 || t.clientY > 150) return;
    var agora = Date.now(); toques = toques.filter(function(x){ return agora - x < 3000; }); toques.push(agora);
    if(toques.length >= 5 && document.body) iniciar();
  }, {passive:true});
})();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CodeChave">
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  // iOS mais antigo nem sempre reporta "display-mode:standalone" direito no CSS,
  // entao reforca aqui via navigator.standalone (ver a classe .standalone-app no CSS).
  if (window.navigator && window.navigator.standalone === true) {
    document.documentElement.classList.add('standalone-app');
  }
</script>
<link rel="stylesheet" href="style.css?v=202610141152">
</head>
<body>

          <span>Início</span>
        </button>
        <button class="tab-btn" data-tab="leads" onclick="tabTap('leads')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.2c1.8.5 3 2 3 3.8s-1.2 3.3-3 3.8"/><path d="M21.5 19c0-2.8-1.9-5-4.6-5.7"/></svg>
          <span>Leads</span>
        </button>
        <button class="tab-btn" data-tab="contas" onclick="tabTap('contas')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.4-1.6 1.7-2.4 3.2-2.4s2.8.8 3.2 2.4"/><path d="M15 10h3.5M15 13h3.5"/></svg>
          <span>Contas</span>
        </button>
        <button class="tab-btn" data-tab="empreendimentos" onclick="tabTap('empreendimentos')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l7-5 7 5v12"/><path d="M9 21v-6h4v6"/><path d="M9 12h.01M13 12h.01M9 9h.01M13 9h.01"/></svg>
          <span>Imóveis</span>
        </button>
        <button class="tab-btn" data-tab="negocios" onclick="tabTap('negocios')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          <span>Oportunidades</span>
        </button>
      </nav>
      <div id="overlay"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

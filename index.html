<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CodeChave</title>
<!-- PWA: instalar na tela de inicio do iPhone/Android e abrir em tela cheia, sem
     a barra do navegador - "Adicionar a Tela de Inicio" no Safari, ou "Instalar app" no menu do Chrome -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#303e47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CodeChave">
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  // iOS mais antigo nem sempre reporta "display-mode:standalone" direito no CSS,
  // entao reforca aqui via navigator.standalone (ver a classe .standalone-app no CSS).
  if (window.navigator && window.navigator.standalone === true) {
    document.documentElement.classList.add('standalone-app');
  }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <div class="rig">
    <div class="bezel"></div>
    <div class="device" id="device">
      <main id="view"></main>
      <div id="selbar"></div>
      <nav class="tabbar" id="tabbar" hidden>
        <button class="tab-btn" data-tab="home" onclick="tabTap('home')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span>Início</span>
        </button>
        <button class="tab-btn" data-tab="clientes" onclick="tabTap('clientes')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.2c1.8.5 3 2 3 3.8s-1.2 3.3-3 3.8"/><path d="M21.5 19c0-2.8-1.9-5-4.6-5.7"/></svg>
          <span>Clientes</span>
        </button>
        <div class="tab-plus">
          <button onclick="abrirAcoes()" aria-label="Nova ação">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>
        <button class="tab-btn" data-tab="empreendimentos" onclick="tabTap('empreendimentos')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l7-5 7 5v12"/><path d="M9 21v-6h4v6"/><path d="M9 12h.01M13 12h.01M9 9h.01M13 9h.01"/></svg>
          <span>Imóveis</span>
        </button>
        <button class="tab-btn" data-tab="negocios" onclick="tabTap('negocios')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          <span>Negócios</span>
        </button>
      </nav>
      <div id="overlay"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<input type="file" id="avatarFileInput" accept="image/*" hidden onchange="onAvatarFileChosen(event)">
<input type="file" id="doc-cam-input" accept="image/*" capture="environment" hidden onchange="handleDocUploadChange(event)">
<input type="file" id="doc-file-input" accept="image/*,.pdf" hidden onchange="handleDocUploadChange(event)">

<script src="app.js"></script>

<div id="pdfDoc"></div>
</body>
</html>
